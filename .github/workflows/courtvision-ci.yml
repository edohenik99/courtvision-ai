name: CourtVision CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Validate Python syntax
        run: python -B -m py_compile courtvision\sports\nba\player_points_research_runner.py tools\run_nba_player_points_research.py

      - name: Test NBA prospective evidence and model-freeze foundation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prospectiveTemp = Join-Path $env:RUNNER_TEMP ('nba-prospective-' + [guid]::NewGuid().ToString('N').Substring(0, 12))
          New-Item -ItemType Directory -Path $prospectiveTemp | Out-Null
          $env:TEMP = $prospectiveTemp
          $env:TMP = $prospectiveTemp
          $env:TMPDIR = $prospectiveTemp
          $env:PYTHONDONTWRITEBYTECODE = '1'
          $qualification = @'
          import os, sys, tempfile
          from pathlib import Path
          root = Path(sys.argv[1])
          if not os.path.samefile(tempfile.gettempdir(), root):
              raise SystemExit('STOP: pytest temp root differs from declared root')
          target = root / 'canary-file'
          target.write_bytes(b'canary')
          directory = root / 'canary-directory'
          directory.mkdir(mode=0o700)
          (directory / 'probe').write_bytes(b'probe')
          assert (directory / 'probe').read_bytes() == b'probe' and list(directory.iterdir())
          try:
              os.symlink(target, root / 'file-link')
              os.symlink(directory, root / 'directory-link', target_is_directory=True)
          except OSError as exc:
              raise SystemExit('STOP: exact-runner symlink canary failed: ' + repr(exc))
          for name in ('file-link', 'directory-link'):
              (root / name).unlink()
          (directory / 'probe').unlink()
          directory.rmdir()
          target.unlink()
          print('TEMP_ROOT_CANARY=PASS FILE_SYMLINK_CANARY=PASS DIRECTORY_SYMLINK_CANARY=PASS CLEANUP_CANARY=PASS', flush=True)
          import pytest
          real_symlink = os.symlink
          def guarded_symlink(*args, **kwargs):
              try:
                  return real_symlink(*args, **kwargs)
              except OSError as exc:
                  if getattr(exc, 'winerror', None) == 1314:
                      pytest.exit('STOP: WinError 1314 in exact pytest runner', returncode=3)
                  raise
          os.symlink = guarded_symlink
          sys.exit(pytest.main(['-q', '-x', '-p', 'no:cacheprovider', '--basetemp', str(root / 'pytest'), 'tests/test_nba_prospective_foundation.py']))
          '@
          python -B -c $qualification $prospectiveTemp
          exit $LASTEXITCODE

      - name: Test NBA player points research runner
        run: python -B -m pytest -p no:cacheprovider tests\test_nba_player_points_research_runner.py -q

      - name: Test NBA player points settlement closing binding
        run: python -B -m pytest -p no:cacheprovider tests\test_nba_player_points_settlement_closing_binding.py -q

      - name: Test Phase B market contracts
        run: python -B -m pytest -p no:cacheprovider tests/test_market_taxonomy.py tests/test_probability_contract.py tests/test_reasoning_contract.py tests/test_market_candidate_contract.py tests/test_mlb_hr_market_adapter.py -q

      - name: Test MLB batter hits research slice
        run: python -B -m pytest -p no:cacheprovider tests/test_mlb_batter_hits.py tests/test_mlb_batting_results.py -q

      - name: Test MLB Hits identity and feature assembly
        run: python -B -m pytest -p no:cacheprovider tests/test_mlb_hits_identity.py tests/test_mlb_hits_features.py -q

      - name: Test MLB Hits evidence acquisition
        run: python -B -m pytest -p no:cacheprovider tests/test_mlb_hits_acquisition.py -q

      - name: Test MLB CourtVision AB projection
        run: python -B -m pytest -p no:cacheprovider tests/test_mlb_ab_projection.py -q

      - name: Test MLB multi-market source normalization
        run: python -B -m pytest -p no:cacheprovider tests/test_mlb_market_data.py tests/test_mlb_the_odds_api_market_adapter.py -q

      - name: Test MLB controlled Odds API ingestion
        run: python -B -m pytest -p no:cacheprovider tests/test_mlb_the_odds_api_live.py tests/test_mlb_market_ingestion_evidence.py tests/test_mlb_the_odds_api_permit.py -q

      - name: Validate MLB HR research syntax
        run: python -B -m py_compile courtvision\sports\mlb\training\hr_research_baseline.py courtvision\sports\mlb\training\hr_prospective_trial.py tools\mlb_hr_recovery_contract.py tools\courtvision_pinned_finalizer_contract.py tools\courtvision_mlb_nightly_pipeline.py

      - name: Test MLB HR prospective research
        run: python -B -m pytest -p no:cacheprovider tests\test_mlb_hr_prospective_research_tooling.py tests\test_mlb_hr_research_baseline.py tests\test_mlb_hr_prospective_trial.py tests\test_mlb_hr_prospective_market_movement.py tests\test_mlb_hr_recovery_input_boundaries.py tests\test_mlb_hr_recovery_evidence_category.py tests\test_mlb_hr_recovery_lock_publication.py tests\test_mlb_hr_recovery_automation.py tests\test_2d1_pinned_finalizer_contract.py tests\test_courtvision_mlb_nightly_pipeline.py tests\test_mlb_recovery_finalizer_boundary.py -q

      - name: Test MLB HR recovery PowerShell contracts
        shell: pwsh
        run: |
          $scratchRoot = Join-Path $env:RUNNER_TEMP ('mlb-recovery-contracts-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $scratchRoot -ErrorAction Stop | Out-Null
          ./tests/test_mlb_hr_recovery_contracts.ps1 -ScratchRoot $scratchRoot

  validate-hits-acquisition-posix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Test MLB Hits acquisition on POSIX
        run: >-
          python -B -m pytest -p no:cacheprovider
          tests/test_mlb_hits_acquisition.py
          tests/test_mlb_hr_prospective_context_acquisition.py::test_capture_manifest_and_disk_paths_share_portable_posix_keys
          -q

      - name: Test NBA prospective exclusive payload writes on POSIX
        run: |
          python -B - <<'PY'
          import os, sys, tempfile, uuid
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / ('nba-payload-' + uuid.uuid4().hex[:12])
          root.mkdir(mode=0o700)
          for name in ('TEMP', 'TMP', 'TMPDIR'):
              os.environ[name] = str(root)
          os.environ['PYTHONDONTWRITEBYTECODE'] = '1'
          tempfile.tempdir = None
          assert os.path.samefile(tempfile.gettempdir(), root)
          target = root / 'canary-file'
          target.write_bytes(b'canary')
          directory = root / 'canary-directory'
          directory.mkdir(mode=0o700)
          os.symlink(target, root / 'file-link')
          os.symlink(directory, root / 'directory-link', target_is_directory=True)
          for name in ('file-link', 'directory-link'):
              (root / name).unlink()
          directory.rmdir()
          target.unlink()
          print('TEMP_ROOT_CANARY=PASS FILE_SYMLINK_CANARY=PASS DIRECTORY_SYMLINK_CANARY=PASS CLEANUP_CANARY=PASS', flush=True)
          attempts = []
          def offline(event, args):
              if event in {'socket.connect', 'socket.getaddrinfo', 'socket.sendto'}:
                  attempts.append(event)
                  raise RuntimeError('OFFLINE_PROVIDER_NETWORK_FORBIDDEN')
          sys.addaudithook(offline)
          import pytest
          selected = 'parent_or_leaf_substitution or acquired_directory_guard or secure_payload_creation or failed_secure_payload_write or directory_claim'
          result = pytest.main(['-q', '-x', '-p', 'no:cacheprovider', '--basetemp', str(root / 'pytest'), 'tests/test_nba_prospective_foundation.py', '-k', selected])
          sys.exit(result if not attempts else 3)
          PY

