name: CourtVision CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Validate Python syntax
        run: python -B -m py_compile courtvision\sports\nba\player_points_research_runner.py tools\run_nba_player_points_research.py

      - name: Test NBA player points research runner
        run: python -B -m pytest -p no:cacheprovider tests\test_nba_player_points_research_runner.py -q

      - name: Test NBA player points settlement closing binding
        run: python -B -m pytest -p no:cacheprovider tests\test_nba_player_points_settlement_closing_binding.py -q

      - name: Validate MLB HR research syntax
        run: python -B -m py_compile courtvision\sports\mlb\training\hr_research_baseline.py

      - name: Test MLB HR prospective research
        run: python -B -m pytest -p no:cacheprovider tests\test_mlb_hr_prospective_research_tooling.py tests\test_mlb_hr_research_baseline.py -q
